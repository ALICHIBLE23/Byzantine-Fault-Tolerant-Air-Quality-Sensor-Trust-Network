global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sensors
    static_configs:
      - targets: ["sensors:8000"]

  - job_name: aggregators
    static_configs:
      - targets: ["aggregator-a1:8000", "aggregator-a2:8000", "aggregator-b1:8000", "aggregator-b2:8000"]

  - job_name: logging-svc
    static_configs:
      - targets: ["logging-svc:8000"]

  - job_name: evaluator
    static_configs:
      - targets: ["evaluator:8000"]

  - job_name: alerting
    static_configs:
      - targets: ["alerting:8000"]
