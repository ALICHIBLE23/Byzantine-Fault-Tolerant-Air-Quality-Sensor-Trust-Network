name: trustmesh

# The ":Z" mount option relabels files for SELinux (needed on Fedora,
# ignored on Docker Desktop for Windows/macOS).

x-python-service: &python-service
  build: .
  image: trustmesh-python:dev
  restart: unless-stopped
  environment: &python-env
    POSTGRES_USER: ${POSTGRES_USER:-trustmesh}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmesh}
    POSTGRES_DB: ${POSTGRES_DB:-trustmesh}
    MQTT_HOST: mosquitto
    PG_HOST: postgres
    REDIS_HOST: redis
    LOG_URL: http://logging-svc:8000/logs

# Aggregator replicas. INSTANCE_ID must equal the service name (experiments use it to find containers).
x-aggregator: &aggregator
  <<: *python-service
  command: ["python", "-m", "services.aggregator.main"]
  stop_grace_period: 5s
  depends_on:
    mosquitto:
      condition: service_started
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    logging-svc:
      condition: service_healthy

x-aggregator-env: &aggregator-env
  <<: *python-env
  LEASE_TTL_MS: ${LEASE_TTL_MS:-3000}
  LEASE_RENEW_MS: ${LEASE_RENEW_MS:-1000}
  FENCING_SELF_CHECK: ${FENCING_SELF_CHECK:-true}
  BORDER_EXCHANGE: ${BORDER_EXCHANGE:-true}
  CONCURRENCY: ${CONCURRENCY:-optimistic}
  CONCURRENCY_THINK_MS: ${CONCURRENCY_THINK_MS:-0}
  ALERT_THRESHOLD: ${ALERT_THRESHOLD:-35.5}

services:
  # ---------------- infrastructure ----------------
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmesh}
      POSTGRES_DB: ${POSTGRES_DB:-trustmesh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prom-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/trustmesh-overview.json
      POSTGRES_USER: ${POSTGRES_USER:-trustmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmesh}
      POSTGRES_DB: ${POSTGRES_DB:-trustmesh}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

  # ---------------- TrustMesh services ----------------
  logging-svc:
    <<: *python-service
    command: ["uvicorn", "services.logging_svc.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--no-access-log"]
    environment:
      <<: *python-env
      INSTANCE_ID: logging-1
    ports:
      - "${LOGGING_PORT:-8081}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  sensors:
    <<: *python-service
    command: ["python", "-m", "services.sensors.main"]
    environment:
      <<: *python-env
      INSTANCE_ID: sensors-1
      NUM_SENSORS: ${NUM_SENSORS:-400}
      PUBLISH_INTERVAL_S: ${PUBLISH_INTERVAL_S:-2.0}
      BEHAVIOR_MIX: ${BEHAVIOR_MIX:-}
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      logging-svc:
        condition: service_healthy

  # Partition A (north) and partition B (south), two replicas each.
  aggregator-a1:
    <<: *aggregator
    environment:
      <<: *aggregator-env
      INSTANCE_ID: aggregator-a1
      REGIONS: r-0-0,r-0-1

  aggregator-a2:
    <<: *aggregator
    environment:
      <<: *aggregator-env
      INSTANCE_ID: aggregator-a2
      REGIONS: r-0-0,r-0-1

  aggregator-b1:
    <<: *aggregator
    environment:
      <<: *aggregator-env
      INSTANCE_ID: aggregator-b1
      REGIONS: r-1-0,r-1-1

  aggregator-b2:
    <<: *aggregator
    environment:
      <<: *aggregator-env
      INSTANCE_ID: aggregator-b2
      REGIONS: r-1-0,r-1-1
      VOTE_BIAS: ${B2_VOTE_BIAS:-0}   # experiment: make this replica lie in its alert votes

  alerting:
    <<: *python-service
    command: ["python", "-m", "services.alerting.main"]
    environment:
      <<: *python-env
      INSTANCE_ID: alerting-1
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-35.5}
      ALERT_QUORUM: ${ALERT_QUORUM:-2}
      ALERT_REPLICAS: 2
      ALERT_CLEAR_WINDOWS: ${ALERT_CLEAR_WINDOWS:-2}
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      logging-svc:
        condition: service_healthy

  evaluator:
    <<: *python-service
    command: ["python", "-m", "services.evaluator.main"]
    environment:
      <<: *python-env
      INSTANCE_ID: evaluator-1
      NUM_SENSORS: ${NUM_SENSORS:-400}
      BEHAVIOR_MIX: ${BEHAVIOR_MIX:-}
    depends_on:
      logging-svc:
        condition: service_healthy

volumes:
  redis-data:
  pg-data:
  prom-data:
  grafana-data:
